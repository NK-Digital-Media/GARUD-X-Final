<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARUD X - Architect Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Auth Check
        if(localStorage.getItem("userAuth") !== "active") {
            window.location.href = "index.html";
        }
    </script>
</head>
<body class="bg-black text-zinc-100 min-h-screen p-6 font-sans">
    <div class="max-w-3xl mx-auto mt-10">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black tracking-tighter uppercase italic">Architect Console</h1>
            <button onclick="logout()" class="text-xs bg-zinc-800 px-4 py-2 rounded-full hover:bg-red-900 transition">LOGOUT</button>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl shadow-2xl">
            <label class="block text-sm text-zinc-500 mb-4 uppercase tracking-widest font-bold">Neural Prompt Input</label>
            <textarea id="promptInput" 
                placeholder="Ex: Cinematic UI for Garuda Legend Series..." 
                class="w-full h-40 bg-black border border-zinc-800 rounded-2xl p-5 text-white outline-none focus:border-white transition resize-none"></textarea>
            
            <button onclick="generateUI()" id="genBtn" class="w-full mt-6 bg-white text-black font-black py-4 rounded-2xl hover:scale-[1.01] active:scale-95 transition-all uppercase text-sm tracking-tighter">
                GENERATE WORLD-CLASS UI
            </button>
        </div>
        <p id="status" class="text-center text-zinc-600 text-[10px] mt-8 uppercase tracking-[0.3em] font-bold">READY FOR NEURAL INPUT</p>
    </div>

    <script>
        function logout() {
            localStorage.removeItem("userAuth");
            window.location.href = "index.html";
        }

        async function generateUI() {
            const prompt = document.getElementById('promptInput').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('genBtn');
            // TUNNEL URL UPDATED TO SERVEO
            const tunnelURL = "https://934fbf8633d990a1-157-48-97-120.serveousercontent.com"; 

            if(!prompt) {
                status.innerText = "PROMPT IS EMPTY, ARCHITECT!";
                return;
            }

            btn.disabled = true;
            status.className = "text-center text-yellow-500 text-[10px] mt-8 uppercase tracking-[0.3em] font-bold";
            status.innerText = "ESTABLISHING NEURAL LINK...";

            try {
                const response = await fetch(`${tunnelURL}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                if(response.ok) {
                    status.className = "text-center text-green-500 text-[10px] mt-8 uppercase tracking-[0.3em] font-bold";
                    status.innerText = "BUILD SUCCESSFUL! DEPLOYING...";
                    setTimeout(() => {
                        window.open("https://nk-digital-media.github.io/GARUD-X-Final/generated_project.html", "_blank");
                        btn.disabled = false;
                        status.className = "text-center text-zinc-600 text-[10px] mt-8 uppercase tracking-[0.3em] font-bold";
                        status.innerText = "READY FOR NEXT BUILD";
                    }, 2000); 
                } else {
                    throw new Error("Server communication failed");
                }
            } catch (err) {
                status.className = "text-center text-red-500 text-[10px] mt-8 uppercase tracking-[0.3em] font-bold";
                status.innerText = "LINK FAILED: CHECK TERMUX ENGINE";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
