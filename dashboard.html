<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARUD X | AI Employee Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #070b14; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center p-6">
    <header class="w-full max-w-5xl flex justify-between items-center mb-10">
        <h1 class="text-3xl font-black text-blue-500">GARUD X <span class="text-[10px] text-slate-500 tracking-widest ml-2">AI EMPLOYEE</span></h1>
        <div class="text-[10px] font-bold bg-blue-500/10 text-blue-400 px-4 py-2 rounded-full border border-blue-500/20 shadow-[0_0_15px_rgba(59,130,246,0.1)]">CORE SYSTEM ONLINE</div>
    </header>

    <main class="w-full max-w-3xl glass p-8 rounded-[2.5rem] shadow-2xl">
        <h2 class="text-xl font-bold mb-2">Master Architect Console</h2>
        <p class="text-slate-400 text-sm mb-6 font-medium">Explain the project. GARUD X will handle the rest.</p>
        
        <textarea id="prompt" class="w-full h-40 bg-slate-900 border border-slate-800 p-4 rounded-2xl outline-none focus:border-blue-500/50 transition mb-6 placeholder-slate-600" placeholder="E.g. Build a luxury car dealership mobile app with a dark minimalist theme and AI chat support..."></textarea>
        
        <button class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black text-lg transition-all active:scale-95 shadow-lg shadow-blue-900/40">
            INITIATE NEURAL BUILD
        </button>
    </main>

    <div class="mt-8 flex gap-4 text-[10px] font-bold text-slate-600 tracking-tighter uppercase">
        <span>Unlimited Logic</span>
        <span>•</span>
        <span>Global Data Access</span>
        <span>•</span>
        <span>Zero Constraint</span>
    </div>
</body>
</html>
