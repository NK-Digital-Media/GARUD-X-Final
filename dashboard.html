<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Security: No entry without login
        if(localStorage.getItem("userAuth") !== "active") {
            window.location.href = "index.html";
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARUD X - Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen p-6 font-sans">
    <div class="max-w-3xl mx-auto mt-10">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black tracking-tighter uppercase">Architect Console</h1>
            <button onclick="logout()" class="text-xs bg-zinc-800 px-4 py-2 rounded-full hover:bg-red-900 transition">LOGOUT</button>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl shadow-2xl">
            <label class="block text-sm text-zinc-500 mb-4 uppercase tracking-widest font-bold">Neural Prompt Input</label>
            <textarea id="promptInput" 
                placeholder="Ex: Ultra-luxury Jewelry Boutique with dark mode and rose gold..." 
                class="w-full h-40 bg-black border border-zinc-800 rounded-2xl p-5 text-white outline-none focus:border-white transition resize-none"></textarea>
            
            <button onclick="generateUI()" id="genBtn" class="w-full mt-6 bg-white text-black font-black py-4 rounded-2xl hover:scale-[1.02] active:scale-95 transition-all">
                GENERATE WORLD-CLASS UI
            </button>
        </div>

        <p class="text-center text-zinc-600 text-[10px] mt-10 uppercase tracking-[0.2em]">Garud X Neural Engine v1.0</p>
    </div>

    <script>
        function logout() {
            localStorage.removeItem("userAuth");
            window.location.href = "index.html";
        }

        async function generateUI() {
            const prompt = document.getElementById('promptInput').value;
            const btn = document.getElementById('genBtn');
            
            if(!prompt) return alert("Pehle prompt toh dalo bhai!");

            btn.innerText = "ESTABLISHING NEURAL LINK...";
            btn.disabled = true;

            console.log("🚀 Sending to GARUD Engine: " + prompt);
            
            // Abhi ke liye ye alert dega, next step mein hum ise Termux Engine se jochenge
            setTimeout(() => {
                alert("Prompt Received: " + prompt + "\nNext: Connecting to Termux Server...");
                btn.innerText = "GENERATE WORLD-CLASS UI";
                btn.disabled = false;
            }, 1000);
        }
    </script>
</body>
</html>
