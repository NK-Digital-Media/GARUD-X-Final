<div class="h-screen bg-gray-900 flex justify-center items-center">
  <div class="bg-gray-800 p-10 rounded-lg w-1/2">
    <h1 class="text-3xl text-white font-bold mb-4">GARUD X</h1>
    <p class="text-lg text-gray-400 mb-6">Create an account to start your journey</p>
    <form>
      <div class="mb-4">
        <label class="block text-gray-400 text-lg mb-2" for="name">Name</label>
        <input type="text" id="name" class="bg-gray-700 border border-gray-600 rounded-lg p-2 w-full" />
      </div>
      <div class="mb-4">
        <label class="block text-gray-400 text-lg mb-2" for="email">Email</label>
        <input type="email" id="email" class="bg-gray-700 border border-gray-600 rounded-lg p-2 w-full" />
      </div>
      <div class="mb-4">
        <label class="block text-gray-400 text-lg mb-2" for="password">Password</label>
        <input type="password" id="password" class="bg-gray-700 border border-gray-600 rounded-lg p-2 w-full" />
      </div>
      <div class="mb-4">
        <label class="block text-gray-400 text-lg mb-2" for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" class="bg-gray-700 border border-gray-600 rounded-lg p-2 w-full" />
      </div>
      <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg w-full">Signup</button>
    </form>
    <p class="text-gray-400 text-lg mt-4">Already have an account? <a href="#" class="text-blue-500 hover:text-blue-700">Login</a></p>
  </div>
</div>
