<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARUD X Signup</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
</head>
<body class="bg-gray-900 h-screen flex justify-center items-center">
    <div class="bg-gray-800 p-10 rounded-2xl shadow-2xl">
        <h1 class="text-3xl text-white font-bold mb-4">GARUD X</h1>
        <h2 class="text-xl text-gray-500 mb-6">Create your account</h2>
        <form>
            <div class="mb-4">
                <label for="username" class="block text-gray-500 text-sm mb-2">Username</label>
                <input type="text" id="username" class="bg-gray-700 text-white border border-gray-600 p-2 rounded-lg w-full">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-500 text-sm mb-2">Email</label>
                <input type="email" id="email" class="bg-gray-700 text-white border border-gray-600 p-2 rounded-lg w-full">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-500 text-sm mb-2">Password</label>
                <input type="password" id="password" class="bg-gray-700 text-white border border-gray-600 p-2 rounded-lg w-full">
            </div>
            <div class="mb-4">
                <label for="confirm-password" class="block text-gray-500 text-sm mb-2">Confirm Password</label>
                <input type="password" id="confirm-password" class="bg-gray-700 text-white border border-gray-600 p-2 rounded-lg w-full">
            </div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Signup</button>
        </form>
        <p class="text-gray-500 text-sm mt-4">Already have an account? <a href="#" class="text-blue-500 hover:text-blue-700">Login</a></p>
    </div>
</body>
</html>
