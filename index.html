<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARUD X - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center h-screen">
    <div class="bg-zinc-900 p-8 rounded-2xl border border-zinc-800 w-80">
        <h2 class="text-2xl font-bold mb-6 text-center">Neural Access</h2>
        <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-4 bg-black border border-zinc-700 rounded-lg outline-none">
        <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 bg-black border border-zinc-700 rounded-lg outline-none">
        <button onclick="validateLogin()" class="w-full bg-white text-black font-bold p-3 rounded-lg hover:bg-zinc-200 transition">Enter Console</button>
    </div>

    <script>
        function validateLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if(email === "admin@garud.com" && pass === "GARUD123") {
                localStorage.setItem("userAuth", "active");
                window.location.href = "dashboard.html";
            } else {
                alert("Galat Email ya Password!");
            }
        }
    </script>
</body>
</html>
