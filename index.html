<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARUD X Signup</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <style>
        .glass {
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
</head>
<body class="h-screen bg-gray-900 bg-gradient-to-r from-gray-800 to-gray-900 flex justify-center items-center">
    <div class="glass p-10 rounded-2xl w-1/2 lg:w-2/5">
        <h1 class="text-3xl text-white font-bold mb-4">GARUD X</h1>
        <h2 class="text-xl text-gray-400 mb-8">Create an account</h2>
        <form>
            <div class="mb-6">
                <label for="username" class="block text-white text-sm font-medium mb-2">Username</label>
                <input id="username" class="bg-gray-700 border border-gray-600 rounded-lg p-2 w-full" type="text" required>
            </div>
            <div class="mb-6">
                <label for="email" class="block text-white text-sm font-medium mb-2">Email</label>
                <input id="email" class="bg-gray-700 border border-gray-600 rounded-lg p-2 w-full" type="email" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-white text-sm font-medium mb-2">Password</label>
                <input id="password" class="bg-gray-700 border border-gray-600 rounded-lg p-2 w-full" type="password" required>
            </div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg w-full mb-4">Signup</button>
            <p class="text-gray-400 text-sm">Already have an account? <a href="#" class="text-blue-500 hover:text-blue-700">Login</a></p>
        </form>
    </div>
</body>
</html>
