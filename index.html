<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="h-screen bg-gray-900 flex justify-center items-center">
    <div class="max-w-5xl mx-auto p-4 pt-6 md:p-6 lg:p-8">
        <div class="text-center mb-12">
            <h1 class="text-3xl text-white font-bold mb-4">Finance Tracker</h1>
            <p class="text-lg text-gray-500">Easy and simple way to track your finances.</p>
        </div>
        <div class="flex flex-wrap justify-center -mx-4">
            <div class="w-full xl:w-8/12 p-4">
                <div class="bg-gray-800 px-6 py-8 rounded-lg shadow-2xl">
                    <h2 class="text-xl text-white font-bold mb-4">Features</h2>
                    <ul>
                        <li class="text-lg text-gray-500 mb-2"><i class="fas fa-check text-blue-500 mr-2"></i> Track expenses and income</li>
                        <li class="text-lg text-gray-500 mb-2"><i class="fas fa-check text-blue-500 mr-2"></i> Set budgets and goals</li>
                        <li class="text-lg text-gray-500 mb-2"><i class="fas fa-check text-blue-500 mr-2"></i> Financial reports and analytics</li>
                    </ul>
                </div>
            </div>
            <div class="w-full xl:w-4/12 p-4">
                <div class="bg-gray-800 px-6 py-8 rounded-lg shadow-2xl">
                    <h2 class="text-xl text-white font-bold mb-4">Get Started</h2>
                    <button class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg mb-4">Sign Up</button>
                    <button class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Log In</button>
                </div>
            </div>
        </div>
        <div class="text-center mt-12">
            <p class="text-lg text-gray-500">Copyright 2023 Finance Tracker. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
