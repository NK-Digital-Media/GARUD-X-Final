<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARUD X | Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">
    <div class="glass max-w-md w-full p-8 rounded-3xl shadow-2xl border-t border-blue-500/30">
        <h1 class="text-4xl font-black text-center mb-1 text-blue-500 tracking-tight">GARUD X</h1>
        <p class="text-slate-400 text-center mb-8 text-sm">Start your professional journey</p>
        <div class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-500 ml-1">FULL NAME</label>
                <input type="text" placeholder="Neeraj Verma" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 ml-1">EMAIL ADDRESS</label>
                <input type="email" placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:border-blue-500 outline-none transition">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 ml-1">PASSWORD</label>
                <input type="password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:border-blue-500 outline-none transition">
            </div>
            <button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/20 transition-all active:scale-95 mt-4">Create Account</button>
        </div>
        <p class="text-center mt-6 text-sm text-slate-500">Already have an account? <a href="#" class="text-blue-400 hover:underline">Login</a></p>
    </div>
</body>
</html>
