<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Gaming Lounge</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .glitch {
            position: relative;
        }
        .glitch:after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            color: #ff00ff;
            background: linear-gradient(to bottom, #00ff00, #ff00ff);
            -webkit-text-stroke: 1px #fff;
            text-stroke: 1px #fff;
            z-index: -1;
            animation: glitch 5s infinite;
        }
        @keyframes glitch {
            0% {
                clip: rect(0, 100%, 0, 0);
            }
            20% {
                clip: rect(10px, 100%, 0, 0);
            }
            40% {
                clip: rect(0, 100%, 10px, 0);
            }
            60% {
                clip: rect(0, 100%, 0, 10px);
            }
            80% {
                clip: rect(0, 50%, 0, 0);
            }
            100% {
                clip: rect(0, 100%, 0, 0);
            }
        }
    </style>
</head>
<body class="bg-black text-white">
    <nav class="flex justify-between p-4 bg-black text-white border-b border-purple-500">
        <h1 class="text-3xl font-bold glitch" data-text="Cyberpunk Gaming Lounge">Cyberpunk Gaming Lounge</h1>
        <ul class="flex justify-end">
            <li class="mr-6"><a href="#" class="text-lg hover:text-purple-500">Home</a></li>
            <li class="mr-6"><a href="#" class="text-lg hover:text-purple-500">Games</a></li>
            <li class="mr-6"><a href="#" class="text-lg hover:text-purple-500">Community</a></li>
        </ul>
    </nav>
    <main class="container mx-auto p-4">
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="bg-purple-500 p-4 rounded-md shadow-md">
                <h2 class="text-2xl font-bold glitch" data-text="Top Games">Top Games</h2>
                <ul>
                    <li class="py-2 border-b border-white"><a href="#" class="text-lg hover:text-green-500">Game 1</a></li>
                    <li class="py-2 border-b border-white"><a href="#" class="text-lg hover:text-green-500">Game 2</a></li>
                    <li class="py-2 border-b border-white"><a href="#" class="text-lg hover:text-green-500">Game 3</a></li>
                </ul>
            </div>
            <div class="bg-green-500 p-4 rounded-md shadow-md">
                <h2 class="text-2xl font-bold glitch" data-text="Upcoming Events">Upcoming Events</h2>
                <ul>
                    <li class="py-2 border-b border-white"><a href="#" class="text-lg hover:text-purple-500">Event 1</a></li>
                    <li class="py-2 border-b border-white"><a href="#" class="text-lg hover:text-purple-500">Event 2</a></li>
                    <li class="py-2 border-b border-white"><a href="#" class="text-lg hover:text-purple-500">Event 3</a></li>
                </ul>
            </div>
            <div class="bg-purple-500 p-4 rounded-md shadow-md">
                <h2 class="text-2xl font-bold glitch" data-text="Community News">Community News</h2>
                <ul>
                    <li class="py-2 border-b border-white"><a href="#" class="text-lg hover:text-green-500">News 1</a></li>
                    <li class="py-2 border-b border-white"><a href="#" class="text-lg hover:text-green-500">News 2</a></li>
                    <li class="py-2 border-b border-white"><a href="#" class="text-lg hover:text-green-500">News 3</a></li>
                </ul>
            </div>
        </section>
    </main>
    <footer class="bg-black text-white p-4 border-t border-purple-500">
        <p class="text-lg">&copy; 2023 Cyberpunk Gaming Lounge</p>
    </footer>
</body>
</html>
