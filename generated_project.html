<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Gaming Dashboard</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <style>
        .glassmorphism {
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(17, 17, 17, 0.72);
            border-radius: 12px;
            border: 1px solid rgba(209, 213, 219, 0.3);
        }
        .neon-glow {
            text-shadow: 0 0 5px #8f0a1a, 0 0 10px #8f0a1a, 0 0 15px #8f0a1a, 0 0 20px #490a1a, 0 0 25px #490a1a;
            color: #ff00ff;
        }
        .neon-glow-green {
            text-shadow: 0 0 5px #0a8f0a, 0 0 10px #0a8f0a, 0 0 15px #0a8f0a, 0 0 20px #0a490a, 0 0 25px #0a490a;
            color: #00ff00;
        }
        .grid-background {
            background-image: linear-gradient(45deg, #2f2f2f 25%, transparent 25%), 
                              linear-gradient(-45deg, #2f2f2f 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #2f2f2f 75%), 
                              linear-gradient(-45deg, transparent 75%, #2f2f2f 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px, 10px 10px, 0 0;
        }
    </style>
</head>
<body class="h-screen w-screen grid place-items-center bg-gray-900">
    <div class="grid grid-cols-3 gap-4 w-11/12 h-5/6 max-w-7xl">
        <div class="glassmorphism p-4 rounded-lg">
            <h1 class="neon-glow text-3xl font-bold mb-4">Cyberpunk Gaming</h1>
            <p class="text-gray-400 text-lg mb-4">Welcome to the ultra-premium gaming dashboard.</p>
            <button class="bg-gray-800 hover:bg-gray-700 p-2 rounded-lg transition duration-300 ease-in-out">
                <span class="neon-glow text-lg font-bold">Play Now</span>
            </button>
        </div>
        <div class="grid grid-rows-2 gap-4 h-full">
            <div class="glassmorphism p-4 rounded-lg">
                <h2 class="neon-glow-green text-2xl font-bold mb-4">Game Stats</h2>
                <p class="text-gray-400 text-lg mb-4">View your game statistics and performance.</p>
                <button class="bg-gray-800 hover:bg-gray-700 p-2 rounded-lg transition duration-300 ease-in-out">
                    <span class="neon-glow-green text-lg font-bold">View Stats</span>
                </button>
            </div>
            <div class="glassmorphism p-4 rounded-lg">
                <h2 class="neon-glow text-2xl font-bold mb-4">Leaderboards</h2>
                <p class="text-gray-400 text-lg mb-4">Compete with other players and climb the ranks.</p>
                <button class="bg-gray-800 hover:bg-gray-700 p-2 rounded-lg transition duration-300 ease-in-out">
                    <span class="neon-glow text-lg font-bold">View Leaderboards</span>
                </button>
            </div>
        </div>
        <div class="grid grid-rows-2 gap-4 h-full">
            <div class="glassmorphism p-4 rounded-lg grid-background">
                <h2 class="neon-glow-green text-2xl font-bold mb-4">Game Library</h2>
                <p class="text-gray-400 text-lg mb-4">Browse and manage your game library.</p>
                <button class="bg-gray-800 hover:bg-gray-700 p-2 rounded-lg transition duration-300 ease-in-out">
                    <span class="neon-glow-green text-lg font-bold">View Library</span>
                </button>
            </div>
            <div class="glassmorphism p-4 rounded-lg">
                <h2 class="neon-glow text-2xl font-bold mb-4">Settings</h2>
                <p class="text-gray-400 text-lg mb-4">Customize your gaming experience.</p>
                <button class="bg-gray-800 hover:bg-gray-700 p-2 rounded-lg transition duration-300 ease-in-out">
                    <span class="neon-glow text-lg font-bold">View Settings</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
